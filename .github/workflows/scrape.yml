name: Job Scraper

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

# Never let two runs of this workflow overlap. The in-DB run-lock in
# db.start_run() only treats a run as active if it began less than 20 minutes
# ago, so a run that legitimately takes longer stops holding the lock and the
# next scheduled run starts alongside it. Both then hold divergent in-memory
# dedup indexes, which produces duplicate rows and duplicate push
# notifications. Confirmed live on 2026-07-23: run 1670 ran 24.7 min and run
# 1671 started 21.5 min in, and that day produced 29 rows duplicating an
# existing norm_key (17 of them notified) against a baseline of 0-1 on every
# other day.
concurrency:
  group: scrape-ifiok
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python main.py
