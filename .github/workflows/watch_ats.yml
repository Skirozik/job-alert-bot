name: ATS Fast-Path Watcher

# Polls ~104 companies' own ATS boards directly (Greenhouse, Lever, Ashby,
# SmartRecruiters, Workday), catching a posting the moment it goes live on the
# company's own careers page rather than waiting for LinkedIn syndication —
# which ATS vendors' own docs put at 6-48+ hours on the default sync path.
#
# WHY THIS FILE EXISTS: modal_app.py scheduled three jobs — scrape() every 20
# minutes, watch_github() every 2, and watch_ats() every 3. When the pipeline
# moved to GitHub Actions only scrape() was migrated, so both fast paths
# silently stopped when Modal hit its spend limit. Confirmed from the data: the
# most recent "ats:"-prefixed row was 2026-08-04, eleven days before this
# workflow was written, against 13,237 such rows historically. The 104 boards in
# ats_config.py were being polled by nothing at all.

on:
  schedule:
    # This cron is the FALLBACK, not the real cadence. GitHub runs scheduled
    # workflows best-effort: this 10-minute cron measured a 32.4-minute median
    # gap over 200 runs, and offsetting off the herd minute did not help.
    # The external pinger drives the real 5-minute cadence by POSTing to the
    # workflow-dispatch API, which is not deferred — see FAST_PINGS_SETUP.md.
    # Affordable at 5 min since fetch_all_listings was parallelized (3.0-min runs).
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

# The DB lock is scoped to ATS, so this watcher no longer cancels LinkedIn or
# GitHub. This workflow-level guard stops two ATS runs overlapping when a slow
# poll outlives its schedule slot.
concurrency:
  group: watch-ats-ifiok
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 104 boards, several of them large (NVIDIA ~2,000 postings, Capital One
    # ~1,800, Salesforce ~1,500), and Workday pages 20 at a time. A full sweep
    # measured ~30,700 postings. 25 minutes leaves real headroom while still
    # capping a hung run well inside the next slot.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # The candidate profile is not in the repo (it names the owner, and this
      # remote is public): write it from a repository secret at job start.
      - name: Materialize candidate profile
        env:
          PROFILE: ${{ secrets.CANDIDATE_PROFILE_MD }}
        run: |
          printf '%s' "$PROFILE" > Candidate_Profile_and_Filters.md
          test -s Candidate_Profile_and_Filters.md || {
            echo "::error::CANDIDATE_PROFILE_MD secret is empty or unset — the classifier cannot run without it"
            exit 1
          }

      - name: Poll company ATS boards
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFIER_MODEL: ${{ secrets.CLASSIFIER_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ats_watch.py
