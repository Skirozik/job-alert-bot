name: LinkedIn Fast-Path Watcher

# Page-zero fast lane. The full scrape.yml sweep remains the 15-minute
# completeness path because LinkedIn's guest endpoint is not reliably sorted.
on:
  schedule:
    # Fallback only. For punctual five-minute dispatches, add this workflow to
    # the external pinger documented in FAST_PINGS_SETUP.md.
    - cron: '1-56/5 * * * *'
  workflow_dispatch:

# Shared with scrape.yml, so a shallow pass queues behind a full LinkedIn pass
# instead of racing it. ATS/GitHub use different groups and different DB locks.
concurrency:
  group: linkedin-ifiok
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # The candidate profile is not in the repo (it names the owner, and this
      # remote is public): write it from a repository secret at job start.
      - name: Materialize candidate profile
        env:
          PROFILE: ${{ secrets.CANDIDATE_PROFILE_MD }}
        run: |
          printf '%s' "$PROFILE" > Candidate_Profile_and_Filters.md
          test -s Candidate_Profile_and_Filters.md || {
            echo "::error::CANDIDATE_PROFILE_MD secret is empty or unset — the classifier cannot run without it"
            exit 1
          }

      - name: Poll LinkedIn page zero
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFIER_MODEL: ${{ secrets.CLASSIFIER_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python linkedin_watch.py
