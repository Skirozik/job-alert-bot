name: Maintenance (manual)

# One-off maintenance scripts, run here rather than locally.
#
# WHY THIS EXISTS: backfill_target_keys.py and dedupe_existing.py need
# SUPABASE_URL and SUPABASE_SERVICE_KEY. Those already live as repository
# secrets, so running them here means the service_role key never has to be
# copied onto a laptop or into a .env -- which matters more than usual for
# this repo, since the remote is PUBLIC.
#
# Every task defaults to a DRY RUN. Nothing writes or deletes unless you
# explicitly set apply/execute to true when dispatching.

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Which maintenance script to run'
        required: true
        type: choice
        default: backfill_target_keys
        options:
          - backfill_target_keys
          - dedupe_existing
          - audit_apply_dupes
          - count_stars
          - audit_star_gaps
          - star_whatif
          - dismiss_tiktok_bytedance
      confirm:
        description: 'WRITE for real? Leave false for a dry run you can review first.'
        required: true
        type: boolean
        default: false

# Shares the LinkedIn lock: dedupe_existing deletes rows, and doing that while
# a scrape holds an in-memory dedup index built from those rows would make the
# scraper re-insert what was just removed.
concurrency:
  group: linkedin-ifiok
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    # 63k single-row updates even threaded, plus the dedupe pass over the same
    # table. 30 minutes was not enough and a timeout leaves a backfill
    # half-applied.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run ${{ inputs.task }}${{ inputs.confirm && ' (WRITING)' || ' (dry run)' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail

          # The two scripts spell their write flag differently on purpose:
          # --apply merely fills a column, --execute deletes rows.
          # audit_apply_dupes is READ-ONLY: it has no write path and never
          # reads argv, so `confirm` is meaningless for it. Short-circuit
          # explicitly rather than let it fall through -- every other task
          # treats `confirm` as the write gate, and a read-only task quietly
          # accepting a `confirm: true` would imply it had written something.
          if [ "${{ inputs.task }}" = "audit_apply_dupes" ] \
             || [ "${{ inputs.task }}" = "count_stars" ] \
             || [ "${{ inputs.task }}" = "audit_star_gaps" ] \
             || [ "${{ inputs.task }}" = "star_whatif" ]; then
            if [ "${{ inputs.confirm }}" = "true" ]; then
              echo "::notice::${{ inputs.task }} is read-only; 'confirm' is ignored"
            fi
            python "${{ inputs.task }}.py"
            exit 0
          fi

          # A named one-off rather than a free-text company input: a task that
          # bulk-changes status should not take an arbitrary string from a
          # dispatch form.
          if [ "${{ inputs.task }}" = "dismiss_tiktok_bytedance" ]; then
            if [ "${{ inputs.confirm }}" = "true" ]; then
              echo "::warning::dismissing every TikTok/ByteDance row in the review queue"
              python dismiss_company.py TikTok ByteDance --execute
            else
              python dismiss_company.py TikTok ByteDance
            fi
            exit 0
          fi

          case "${{ inputs.task }}" in
            backfill_target_keys) FLAG="--apply"   ;;
            dedupe_existing)      FLAG="--execute" ;;
            *) echo "::error::unknown task"; exit 1 ;;
          esac

          if [ "${{ inputs.confirm }}" = "true" ]; then
            echo "::warning::Running ${{ inputs.task }} $FLAG — this WRITES to the database"
            python "${{ inputs.task }}.py" "$FLAG"
          else
            echo "Dry run. Re-dispatch with confirm=true to apply."
            python "${{ inputs.task }}.py"
          fi
