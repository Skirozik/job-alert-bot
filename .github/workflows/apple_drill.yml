name: Apple and Google Alert Drill

# Once a week, proves the Apple alert and then the Google alert end to end on
# the live sites from GitHub's own runners (the machines Apple sometimes turns
# away): one real internship on each site is treated as new and taken through
# the real reader, the classifier and both pushes, marked DRILL. Nothing is
# written to the tracker. ntfy's copy is read back to confirm delivery; any
# failed step sends a "Job scraper alert" and turns this run red. The two
# drills are independent: one failing does not skip the other.
#
# Both companies post new internships rarely, so without this the first sign
# of a broken alert would be a role you never heard about. Each drill first
# checks that its 5-minute check is running, and each hourly shadow watch
# alarms if its drill has not passed in 8 days (a dropped or disabled
# schedule). See scraper/apple_watch.py and scraper/google_watch.py.

on:
  # The real 9 AM trigger is the external pinger (FAST_PINGS_SETUP.md): a
  # workflow_dispatch from cron-job.org, Mondays 09:00 America/New_York.
  # GitHub's own schedule below is the fallback. It is best-effort, and this
  # repo's morning crons arrive ~4.5 hours late, so expect it early afternoon;
  # after a drill that passed in the last 20 hours it stands down.
  schedule:
    # Both 13:07 UTC (9 AM in summer, UTC-4) and 14:07 (winter, UTC-5); the
    # gate below keeps the one that is 9 AM Eastern this time of year.
    - cron: '7 13 * * 1'
    - cron: '7 14 * * 1'
  workflow_dispatch:

concurrency:
  group: apple-drill-ifiok
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Decided by which cron fired, not by the hour the run starts, so a late
      # start can neither skip the week nor run the drill twice.
      - name: Keep only the 9 AM Eastern run
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then exit 0; fi
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then want='7 13 * * 1'; else want='7 14 * * 1'; fi
          if [ "${{ github.event.schedule }}" != "$want" ]; then
            echo "Not the 9 AM Eastern slot this time of year; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        id: install
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r scraper/requirements.txt

      # The candidate profile is not in the repo (it names the owner, and this
      # remote is public): write it from a repository secret at job start.
      - name: Materialize candidate profile
        id: profile
        if: steps.gate.outputs.skip != 'true'
        env:
          PROFILE: ${{ secrets.CANDIDATE_PROFILE_MD }}
        run: |
          printf '%s' "$PROFILE" > Candidate_Profile_and_Filters.md
          test -s Candidate_Profile_and_Filters.md || {
            echo "::error::CANDIDATE_PROFILE_MD secret is empty or unset — the classifier cannot run without it"
            exit 1
          }

      - name: Run the Apple drill
        id: drill
        if: steps.gate.outputs.skip != 'true'
        # Leaves the job time for the alarm below if the drill hangs.
        timeout-minutes: 8
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFIER_MODEL: ${{ secrets.CLASSIFIER_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python apple_drill.py

      # A drill that dies before it can say so -- the job killed by its
      # timeout, or setup failing before Python runs -- still sends the alarm.
      # Not for setup failing on GitHub's scheduled fallback: that run would
      # most weeks only stand down after the 9 AM pinger's pass, and a fallback
      # that never gets to run is caught by the 8-day "drill has not passed"
      # alarm instead.
      - name: Alarm when the drill did not finish
        if: ${{ always() && steps.gate.outputs.skip != 'true' && steps.drill.outcome != 'success' && steps.drill.outputs.alerted != 'true' && (github.event_name != 'schedule' || steps.drill.outcome == 'failure' || steps.drill.outcome == 'cancelled') }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${{ steps.drill.outcome }}" in
            failure|cancelled) why="it failed or ran out of time" ;;
            *) why="the run failed before the drill started" ;;
          esac
          curl -fsS -H "Title: Job scraper alert" -H "Priority: urgent" -H "Tags: warning,robot" \
            -d "Weekly Apple drill did not finish: $why. A new Apple internship may not reach you until this is fixed. $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"

      # Runs whether or not the Apple drill passed, once the setup above worked.
      - name: Run the Google drill
        id: google
        if: ${{ !cancelled() && steps.gate.outputs.skip != 'true' && steps.install.outcome == 'success' && steps.profile.outcome == 'success' }}
        # Room for its own retries (three reads 30 s apart, the read-back, the pass stamp), so a slow
        # Google ends in the drill's own alarm naming the step, not in this timeout.
        timeout-minutes: 8
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFIER_MODEL: ${{ secrets.CLASSIFIER_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python google_drill.py

      # Skipped because the run was cancelled (by hand, or the job's timeout during the Apple drill,
      # whose own alarm then speaks for the run) is not a Google failure.
      - name: Alarm when the Google drill did not finish
        if: ${{ always() && steps.gate.outputs.skip != 'true' && steps.google.outcome != 'success' && steps.google.outputs.alerted != 'true' && (steps.google.outcome != 'skipped' || !cancelled()) && (github.event_name != 'schedule' || steps.google.outcome == 'failure' || steps.google.outcome == 'cancelled') }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${{ steps.google.outcome }}" in
            failure|cancelled) why="it failed or ran out of time" ;;
            *) why="the run failed before the drill started" ;;
          esac
          curl -fsS -H "Title: Job scraper alert" -H "Priority: urgent" -H "Tags: warning,robot" \
            -d "Weekly Google drill did not finish: $why. A new Google internship may not reach you until this is fixed. $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
