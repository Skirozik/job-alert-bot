name: Job Scraper (User A)

# Runs on GitHub Actions rather than Modal. modal_app_user_a.py exists and
# is correct, but the Modal workspace is over its spend limit and `modal
# deploy` fails outright — this is what unblocks the pipeline. Actions
# minutes are free and unmetered on a public repo.
#
# Entirely separate from the other two personas — separate secrets, separate
# Supabase project, separate ntfy topic. The run-lock lives in each project's
# own scrape_runs table, so these three can never block each other.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# See scrape_user_c.yml for why this exists: the in-DB run-lock goes stale
# after 20 minutes, so a long run stops holding it and the next scheduled run
# starts alongside.
concurrency:
  group: scrape-user_a
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper_user_a/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper_user_a/requirements.txt

      # Gitignored — names a real third party, and this remote is public.
      # classifier.py hard-crashes without it.
      - name: Materialize candidate profile
        env:
          PROFILE: ${{ secrets[format('{0}_PROFILE_MD', vars.USER_A_SECRETS)] }}
        run: |
          printf '%s' "$PROFILE" > User_A_Candidate_Profile_and_Filters.md
          test -s User_A_Candidate_Profile_and_Filters.md || {
            echo "::error::USER_A_PROFILE_MD secret is empty or unset — the classifier cannot run without it"
            exit 1
          }
          echo "profile materialized: $(wc -c < User_A_Candidate_Profile_and_Filters.md) bytes"

      - name: Run scraper
        working-directory: scraper_user_a
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', vars.USER_A_SECRETS)] }}
          SUPABASE_SERVICE_KEY: ${{ secrets[format('SUPABASE_SERVICE_KEY_{0}', vars.USER_A_SECRETS)] }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFIER_MODEL: ${{ secrets.CLASSIFIER_MODEL }}
          NTFY_TOPIC: ${{ secrets[format('NTFY_TOPIC_{0}', vars.USER_A_SECRETS)] }}
        run: python main.py
