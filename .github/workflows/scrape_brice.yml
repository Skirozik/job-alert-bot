name: Job Scraper (Brice)

# Brice's full-time, entry-level search: LinkedIn, 26 company ATS boards and jobright's new-grad
# lists, classified against his rubric. Separate from every other persona: its own Supabase
# project, ntfy topic, profile secret and concurrency group. Infrastructure alerts go to the
# OWNER's topic (secrets.NTFY_TOPIC), never to Brice's.

on:
  schedule:
    # Odd hours at :40, offset from the other forks' even-hour :00 runs. GitHub defers scheduled
    # runs (about 4.5 a day actually arrive); the 24 h LinkedIn window covers the gaps.
    - cron: '40 1-23/2 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-brice
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 60, against a 75-minute run-lock in scraper_brice/db.py (the lock must outlast this).
    # main.py stops starting new work at 48 minutes.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper_brice/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper_brice/requirements.txt

      # The rubric is gitignored (a real person's details; this repo is public), so it is
      # written from a secret at job start. Passed via env: so multi-line content survives.
      - name: Materialize candidate profile
        env:
          PROFILE: ${{ secrets.BRICE_PROFILE_MD }}
        run: |
          printf '%s' "$PROFILE" > Brice_Candidate_Profile_and_Filters.md
          test -s Brice_Candidate_Profile_and_Filters.md || {
            echo "::error::BRICE_PROFILE_MD secret is empty or unset — the classifier cannot run without it"
            exit 1
          }
          echo "profile materialized: $(wc -c < Brice_Candidate_Profile_and_Filters.md) bytes"

      # The structure classifier.py depends on (headings, the numbered INELIGIBLE list, size). It prints check
      # labels only, never rubric text. A wrong upload -- another persona's rubric, an old draft -- stops here
      # instead of classifying and pinging against it.
      - name: Check the rubric's structure
        working-directory: scraper_brice
        env:
          CANDIDATE_PROFILE_PATH: ../Brice_Candidate_Profile_and_Filters.md
        run: python -X utf8 test_rubric_contract.py

      - name: Run scraper
        id: scraper
        working-directory: scraper_brice
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_BRICE }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_BRICE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_BRICE }}
          OWNER_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py

      # main.py alerts the owner itself whenever it gets to run and fails (exit 1). This covers the runs it
      # never got to -- a failed install, an empty profile secret, a rubric that fails its check -- and a run
      # cancelled or killed by the 60-minute timeout. The owner's topic only, never Brice's.
      - name: Alert the owner if the scraper did not run
        if: ${{ always() && steps.scraper.outcome != 'success' && steps.scraper.outcome != 'failure' }}
        env:
          OWNER_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$OWNER_NTFY_TOPIC" || exit 0
          # The response echoes the topic, so it goes to /dev/null, not the log.
          curl -fsS --max-time 20 \
            -H "Title: Brice: workflow failed" \
            -H "Priority: high" \
            -H "Tags: warning,robot" \
            -d "Job Scraper (Brice) stopped before main.py ran, or was cancelled or timed out: $RUN_URL" \
            "https://ntfy.sh/$OWNER_NTFY_TOPIC" > /dev/null || true
